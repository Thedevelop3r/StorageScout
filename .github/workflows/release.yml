# Builds PC Scanner on a GitHub-hosted Windows runner, signs the application and the installer,
# and creates a draft GitHub release for version tags.
#
# Signing, in order of preference (Settings > Secrets and variables > Actions):
#   1. SignPath (free OSS code signing by the SignPath Foundation)
#        Secret    SIGNPATH_API_TOKEN          API token of a SignPath user with submitter rights
#        Variable  SIGNPATH_ORGANIZATION_ID    SignPath organization id
#        Variable  SIGNPATH_PROJECT_SLUG       e.g. pcscanner
#        Variable  SIGNPATH_SIGNING_POLICY     e.g. release-signing
#      Artifact configurations "exe" and "installer" must exist in the SignPath project
#      (copy them from .signpath/artifact-configurations).
#   2. The project's self-signed certificate (see scripts/create-signing-cert.sh)
#        Secret    SIGNING_CERT_PFX_BASE64     base64 of pcscanner-codesign.pfx
#        Secret    SIGNING_CERT_PASSWORD       the PFX password
#   3. Neither configured: unsigned build.
#
# Release: bump `version` in Cargo.toml, commit, then push a tag such as `v0.1.0`.
# Tag builds (or a manual run with "sign" ticked) are signed. Branch pushes and pull
# requests produce unsigned test builds.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the build (SignPath, or the self-signed certificate)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, sign and package (Windows x64)
    runs-on: windows-latest
    # SignPath requests may wait for manual approval.
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    env:
      WANT_SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign == true }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          $signing = if ($env:WANT_SIGN -ne 'true') { 'none' }
                     elseif ($env:HAS_SIGNPATH -eq 'true') { 'signpath' }
                     elseif ($env:HAS_CERT -eq 'true') { 'self' }
                     else { 'none' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "signing=$signing" >> $env:GITHUB_OUTPUT
          "SIGNING=$signing" >> $env:GITHUB_ENV
          Write-Host "Version $version, signing: $signing"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # ---- Self-signed certificate ------------------------------------------------------------
      - name: Load signing certificate
        if: env.SIGNING == 'self'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "pcscanner-codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64.Trim()))
          "SIGNING_PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Sign application (self-signed)
        if: env.SIGNING == 'self'
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 target/release/pcscanner.exe

      # ---- SignPath ---------------------------------------------------------------------------
      - name: Upload unsigned application
        id: upload-exe
        if: env.SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: pcscanner-exe-unsigned
          path: target/release/pcscanner.exe
          if-no-files-found: error

      - name: Sign application (SignPath)
        if: env.SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          wait-for-completion: true
          # Each release is approved manually in SignPath; allow time for that.
          wait-for-completion-timeout-in-seconds: 7200
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          output-artifact-directory: signed/exe

      - name: Use signed application
        if: env.SIGNING == 'signpath'
        shell: pwsh
        run: Copy-Item -Force signed/exe/pcscanner.exe target/release/pcscanner.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $isccArgs = @(
            "/DAppVersion=${{ steps.version.outputs.version }}",
            "/DSourceExe=$((Resolve-Path target/release/pcscanner.exe).Path)",
            "/DOutputDir=$(Join-Path $PWD 'staging/installer')"
          )
          if ($env:SIGNING -eq 'self') {
            # Inno Setup signs the installer and the uninstaller through this command.
            $sign = (Resolve-Path scripts/sign.ps1).Path
            $isccArgs += "/DSign", "/Spcsign=powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sign `$f"
          }
          & $iscc @isccArgs installer/pcscanner.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload unsigned installer
        id: upload-installer
        if: env.SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: pcscanner-installer-unsigned
          path: staging/installer/PCScanner-Setup-${{ steps.version.outputs.version }}-x64.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          wait-for-completion: true
          # Each release is approved manually in SignPath; allow time for that.
          wait-for-completion-timeout-in-seconds: 7200
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          output-artifact-directory: signed/installer

      - name: Use signed installer
        if: env.SIGNING == 'signpath'
        shell: pwsh
        run: Copy-Item -Force "signed/installer/PCScanner-Setup-${{ steps.version.outputs.version }}-x64.exe" staging/installer/

      # ---- Checks and packaging ---------------------------------------------------------------
      - name: Verify signatures
        if: env.SIGNING != 'none'
        shell: pwsh
        run: |
          $expected = $null
          if ($env:SIGNING -eq 'self' -and (Test-Path signing/pcscanner-codesign.cer)) {
            $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2 (Resolve-Path signing/pcscanner-codesign.cer).Path).Thumbprint
          }
          foreach ($f in @("target/release/pcscanner.exe", "staging/installer/PCScanner-Setup-${{ steps.version.outputs.version }}-x64.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if (-not $sig.SignerCertificate) { throw "$f is not signed" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
            if ($expected -and $sig.SignerCertificate.Thumbprint -ne $expected) {
              throw "$f was signed with $($sig.SignerCertificate.Thumbprint), expected $expected (signing/pcscanner-codesign.cer)"
            }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject) [$($sig.SignerCertificate.Thumbprint)]"
          }

      - name: Remove signing certificate
        if: always() && env.SIGNING_PFX_PATH != ''
        shell: pwsh
        run: Remove-Item -Force $env:SIGNING_PFX_PATH -ErrorAction SilentlyContinue

      - name: Assemble release files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          Copy-Item "staging/installer/PCScanner-Setup-$v-x64.exe" release/
          Copy-Item target/release/pcscanner.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item README.md, PRIVACY.md, SIGNING.md portable/
          if ($env:SIGNING -eq 'self' -and (Test-Path signing/pcscanner-codesign.cer)) {
            Copy-Item signing/pcscanner-codesign.cer portable/
            Copy-Item signing/pcscanner-codesign.cer release/
          }
          Compress-Archive -Path portable/* -DestinationPath "release/PCScanner-$v-x64-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: pcscanner-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Create draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: pcscanner-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          repo_url="https://github.com/$GITHUB_REPOSITORY/blob/main"
          if [ "$SIGNING" = "signpath" ]; then
            note="Signed with a certificate from the SignPath Foundation. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy]($repo_url/SIGNING.md)."
          elif [ "$SIGNING" = "self" ]; then
            note="Signed with the project's self-signed certificate (see [SIGNING.md]($repo_url/SIGNING.md) to verify it). Windows SmartScreen shows a warning because the certificate is not issued by a commercial authority: choose **More info → Run anyway**, or build from source."
          else
            note="**Unsigned build.** Windows SmartScreen may warn when you run it."
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "PC Scanner ${TAG#v}" \
            --generate-notes \
            --notes "$note

          Download \`PCScanner-Setup-${TAG#v}-x64.exe\` to install, or the portable zip to run without installing. Checksums are in \`SHA256SUMS.txt\`.
          See the [privacy policy]($repo_url/PRIVACY.md)."
