# Builds PC Scanner on a GitHub-hosted Windows runner, signs the application, the installer
# and the uninstaller with the project's self-signed code signing certificate, and creates a
# draft GitHub release for version tags.
#
# Setup (Settings > Secrets and variables > Actions > Repository secrets):
#   SIGNING_CERT_PFX_BASE64   base64 of pcscanner-codesign.pfx (see scripts/create-signing-cert.sh)
#   SIGNING_CERT_PASSWORD     the PFX password
# Without these secrets, builds are unsigned.
#
# Release: bump `version` in Cargo.toml, commit, then push a tag such as `v0.1.0`.
# Tag builds (or a manual run with "sign" ticked) are signed. Branch pushes and pull
# requests produce unsigned test builds.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, sign and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGN: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ env.SIGN }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, signing: $env:SIGN"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Load signing certificate
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "pcscanner-codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64.Trim()))
          "SIGNING_PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Sign application
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 target/release/pcscanner.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $isccArgs = @(
            "/DAppVersion=${{ steps.version.outputs.version }}",
            "/DSourceExe=$((Resolve-Path target/release/pcscanner.exe).Path)",
            "/DOutputDir=$(Join-Path $PWD 'staging/installer')"
          )
          if ($env:SIGN -eq 'true') {
            # Inno Setup signs the installer and the uninstaller through this command.
            $sign = (Resolve-Path scripts/sign.ps1).Path
            $isccArgs += "/DSign", "/Spcsign=powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sign `$f"
          }
          & $iscc @isccArgs installer/pcscanner.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $expected = $null
          if (Test-Path signing/pcscanner-codesign.cer) {
            $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2 (Resolve-Path signing/pcscanner-codesign.cer).Path).Thumbprint
          }
          foreach ($f in @("target/release/pcscanner.exe", "staging/installer/PCScanner-Setup-${{ steps.version.outputs.version }}-x64.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if (-not $sig.SignerCertificate) { throw "$f is not signed" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
            if ($expected -and $sig.SignerCertificate.Thumbprint -ne $expected) {
              throw "$f was signed with $($sig.SignerCertificate.Thumbprint), expected $expected (signing/pcscanner-codesign.cer)"
            }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject) [$($sig.SignerCertificate.Thumbprint)]"
          }

      - name: Remove signing certificate
        if: always() && env.SIGNING_PFX_PATH != ''
        shell: pwsh
        run: Remove-Item -Force $env:SIGNING_PFX_PATH -ErrorAction SilentlyContinue

      - name: Assemble release files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          Copy-Item "staging/installer/PCScanner-Setup-$v-x64.exe" release/
          Copy-Item target/release/pcscanner.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item README.md, PRIVACY.md, SIGNING.md portable/
          if (Test-Path signing/pcscanner-codesign.cer) {
            Copy-Item signing/pcscanner-codesign.cer portable/
            Copy-Item signing/pcscanner-codesign.cer release/
          }
          Compress-Archive -Path portable/* -DestinationPath "release/PCScanner-$v-x64-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: pcscanner-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Create draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: pcscanner-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          repo_url="https://github.com/$GITHUB_REPOSITORY/blob/main"
          if [ "$SIGNED" = "true" ]; then
            note="Signed with the project's self-signed certificate (see [SIGNING.md]($repo_url/SIGNING.md) to verify it). Windows SmartScreen shows a warning because the certificate is not issued by a commercial authority: choose **More info → Run anyway**, or build from source."
          else
            note="**Unsigned build.** Windows SmartScreen may warn when you run it."
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "PC Scanner ${TAG#v}" \
            --generate-notes \
            --notes "$note

          Download \`PCScanner-Setup-${TAG#v}-x64.exe\` to install, or the portable zip to run without installing. Checksums are in \`SHA256SUMS.txt\`.
          See the [privacy policy]($repo_url/PRIVACY.md)."
