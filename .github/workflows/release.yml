# Builds StorageScout on a GitHub-hosted Windows runner, signs the application, the installer
# and the uninstaller with the project's self-signed code signing certificate, and publishes a
# GitHub release. Installed copies of StorageScout find that release and offer to update.
#
# Setup (Settings > Secrets and variables > Actions > Repository secrets):
#   SIGNING_CERT_PFX_BASE64   base64 of storagescout-codesign.pfx (see scripts/create-signing-cert.sh)
#   SIGNING_CERT_PASSWORD     the PFX password
# Without these secrets, builds are unsigned.
#
# Release: bump `version` in Cargo.toml and merge to `main`. When `main` has a version that
# has no `v<version>` tag yet, the build is signed and published as release `v<version>`
# (the tag is created by the release). Pushing a tag such as `v1.0.0` does the same.
# A published release needs the signing secrets: the app refuses unsigned updates.
# Other branch pushes and pull requests produce unsigned test builds; a manual run with
# "sign" ticked produces a signed build without publishing it.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, sign and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.version.outputs.sign }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: pwsh
        env:
          SIGN_INPUT: ${{ inputs.sign }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $publish = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne "v$version") {
              throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            }
            $publish = $true
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            # Publish once per version: only when the tag does not exist yet.
            $existing = git ls-remote --tags "https://github.com/${{ github.repository }}.git" "refs/tags/v$version"
            if ($LASTEXITCODE -ne 0) { throw "Could not list tags" }
            $publish = -not $existing
          }
          $sign = ($publish -or $env:SIGN_INPUT -eq "true") -and $env:HAS_CERT -eq "true"
          if ($publish -and -not $sign) {
            throw "Version $version would be published unsigned. Add the signing secrets (see SIGNING.md)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "SIGN=$($sign.ToString().ToLower())" >> $env:GITHUB_ENV
          Write-Host "Version $version, publish: $publish, signing: $sign"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Load signing certificate
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "storagescout-codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64.Trim()))
          "SIGNING_PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Sign application
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 target/release/storagescout.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $isccArgs = @(
            "/DAppVersion=${{ steps.version.outputs.version }}",
            "/DSourceExe=$((Resolve-Path target/release/storagescout.exe).Path)",
            "/DOutputDir=$(Join-Path $PWD 'staging/installer')"
          )
          if ($env:SIGN -eq 'true') {
            # Inno Setup signs the installer and the uninstaller through this command.
            $sign = (Resolve-Path scripts/sign.ps1).Path
            $isccArgs += "/DSign", "/Spcsign=powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sign `$f"
          }
          & $iscc @isccArgs installer/storagescout.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $expected = $null
          if (Test-Path signing/storagescout-codesign.cer) {
            $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2 (Resolve-Path signing/storagescout-codesign.cer).Path).Thumbprint
          }
          foreach ($f in @("target/release/storagescout.exe", "staging/installer/StorageScout-Setup-${{ steps.version.outputs.version }}-x64.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if (-not $sig.SignerCertificate) { throw "$f is not signed" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
            if ($expected -and $sig.SignerCertificate.Thumbprint -ne $expected) {
              throw "$f was signed with $($sig.SignerCertificate.Thumbprint), expected $expected (signing/storagescout-codesign.cer)"
            }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject) [$($sig.SignerCertificate.Thumbprint)]"
          }

      - name: Remove signing certificate
        if: always() && env.SIGNING_PFX_PATH != ''
        shell: pwsh
        run: Remove-Item -Force $env:SIGNING_PFX_PATH -ErrorAction SilentlyContinue

      - name: Assemble release files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          Copy-Item "staging/installer/StorageScout-Setup-$v-x64.exe" release/
          Copy-Item target/release/storagescout.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item README.md, PRIVACY.md, SIGNING.md portable/
          if (Test-Path signing/storagescout-codesign.cer) {
            Copy-Item signing/storagescout-codesign.cer portable/
            Copy-Item signing/storagescout-codesign.cer release/
          }
          Compress-Archive -Path portable/* -DestinationPath "release/StorageScout-$v-x64-portable.zip"
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: storagescout-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: storagescout-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          repo_url="https://github.com/$GITHUB_REPOSITORY/blob/main"
          if [ "$SIGNED" = "true" ]; then
            note="Signed with the project's self-signed certificate (see [SIGNING.md]($repo_url/SIGNING.md) to verify it). Windows SmartScreen shows a warning because the certificate is not issued by a commercial authority: choose **More info → Run anyway**, or build from source."
          else
            note="**Unsigned build.** Windows SmartScreen may warn when you run it."
          fi
          # Installed copies of StorageScout pick up the newest published release.
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "StorageScout ${TAG#v}" \
            --generate-notes \
            --notes "$note

          Download \`StorageScout-Setup-${TAG#v}-x64.exe\` to install, or the portable zip to run without installing. Checksums are in \`SHA256SUMS.txt\`. Installed copies of StorageScout 1.0 and later offer this update themselves.
          See the [privacy policy]($repo_url/PRIVACY.md)."
