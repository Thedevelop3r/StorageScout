[package]
name = "pcscanner"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
trash = "5.3.0"
xxhash-rust = { version = "0.8.20", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
