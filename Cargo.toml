[package]
name = "storagescout"
version = "1.0.1"
edition = "2024"
authors = ["Bilal Amjad"]
description = "Scan every drive, file and program on your PC, see what uses space, and clean up safely."
license = "MIT"
repository = "https://github.com/Thedevelop3r/StorageScout"
homepage = "https://github.com/Thedevelop3r/StorageScout"
readme = "README.md"
keywords = ["disk-usage", "disk-analyzer", "cleanup", "egui", "windows"]
categories = ["filesystem", "gui"]

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
trash = "5.3.0"
ureq = "3.5.2"
xxhash-rust = { version = "0.8.20", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Storage_Packaging_Appx"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
